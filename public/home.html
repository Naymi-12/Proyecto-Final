
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketForge - Inicio</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="home-header">

      <div class="logo">TicketForge</div>

        <nav class="main-nav">
            <a href="./home.html" class="active">Inicio</a>
            <a href="./catalog.html">Catálogo</a>

            <a href="./index.html" id="loginLink">
                Iniciar sesión
            </a>
             <a href="./profile.html" id="profileLink">Mi perfil</a>
           
            <div class="user-menu-container hidden" id="userMenuContainer">

                <button
                    id="userButton"
                    class="header-icon"
                    type="button"

                </button>

                <div id="userDropdown" class="user-dropdown hidden">
            <p id="userGreeting"></p>

                     </div>
        

            </div>

            <div class="hero-content">

                <h2>
                    ¡Los mejores eventos<br>

                 Comprar Entradas

            </div>

        </section>

        <section class="featured-section">

            <div class="section-heading">
                <h2>Catálogo</h2>
                <a href="./catalog.html">Ver más</a>
            </div>

            <div id="featuredEvents" class="events-grid">

            </div>

    <script src="./js/events.js"></script>
