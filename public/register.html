
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketForge - Registro</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="header">
        <h1>TicketForge</h1>
    </header>

    <main class="login-container">

        <section class="welcome-panel">
            <div class="welcome-content">
                <h2>¡Únete a TicketForge!</h2>
                <p>Crea tu cuenta y descubre experiencias inolvidables.</p>
            </div>
        </section>

        <section class="form-panel">

            <div class="login-form">

                <h2>Crear cuenta</h2>

                <form id="registerForm">

                    <div class="form-group">
                        <label for="name">Nombre completo</label>
                        <input type="text" id="name"
                            placeholder="Ingresa tu nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email"
                            placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password"
                            placeholder="Crea una contraseña" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmPassword"
                            placeholder="Repite tu contraseña" required>
                    </div>

                    <button type="submit" class="login-button" id="registerButton">
                        Crear cuenta
                    </button>

                    <p id="registerMessage" class="message"></p>

                </form>

                <p class="register-text">
                    ¿Ya tienes una cuenta?
                    <a href="./index.html">Inicia sesión</a>
                </p>

            </div>

        </section>

    </main>

    <script src="./js/register.js"></script>

</body>
</html>
